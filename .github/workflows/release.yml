name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest] # Add 'macos-latest', 'ubuntu-22.04' for cross-platform
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Rename and Prepare Assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $src = "src-tauri/target/release/bundle"
          
          # Create a directory for upload
          New-Item -ItemType Directory -Force -Path "upload_assets"

          # Handle NSIS (setup.exe)
          $nsisSrc = "$src/nsis/scoot_${version}_x64-setup.exe"
          if (Test-Path $nsisSrc) {
            Copy-Item $nsisSrc "upload_assets/scoot-${version}-setup.exe"
          }

          # Handle MSI
          $msiSrc = "$src/msi/scoot_${version}_x64_en-US.msi"
          if (Test-Path $msiSrc) {
             Copy-Item $msiSrc "upload_assets/scoot-${version}.msi"
          }

          # Handle Zip? Tauri might not generate zip by default unless configured or using tauri-action?
          # If tauri build doesn't make a zip, we can make one of the exe.
          # Or if the user meant the "portable" zip?
          # Let's compress the executable + README manually to ensure it meets expectations.
          
          $exePath = "src-tauri/target/release/scoot.exe"
          $readmePath = "README.md"
          
          if (Test-Path $exePath) {
             Compress-Archive -Path $exePath, $readmePath -DestinationPath "upload_assets/scoot-${version}.zip"
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: upload_assets/*
          draft: true
